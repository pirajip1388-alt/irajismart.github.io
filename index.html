<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHome | هوشمندسازی ساختمان در اراک</title>

    <meta name="description"
          content="SmartHome ارائه‌دهنده خدمات هوشمندسازی ساختمان در اراک؛ روشنایی هوشمند، امنیت، دوربین، کنترل دما و تجهیزات هوشمند.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #07111f;
            color: #f5f7fa;
            line-height: 1.9;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }

        /* Header */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(7,17,31,.94);
            border-bottom: 1px solid #20364d;
            backdrop-filter: blur(12px);
        }

        .nav {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            color: #20d6c7;
        }

        .brand span {
            color: white;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: 14px;
        }

        nav a {
            color: #dce7ef;
            transition: .2s;
        }

        nav a:hover {
            color: #20d6c7;
        }

        /* Hero */

        .hero {
            padding: 95px 0 85px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 0%, #164a65 0%, #0b2034 35%, #07111f 72%);
        }

        .badge {
            display: inline-block;
            padding: 6px 17px;
            border: 1px solid #20d6c7;
            border-radius: 30px;
            color: #20d6c7;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(34px, 7vw, 62px);
            line-height: 1.35;
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: #20d6c7;
        }

        .hero p {
            max-width: 720px;
            margin: auto;
            color: #b9c8d6;
            font-size: 17px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 11px;
            font-weight: bold;
            display: inline-block;
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            background: #20d6c7;
            color: #061018;
        }

        .btn-secondary {
            border: 1px solid #45627b;
            color: white;
        }

        /* Sections */

        section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #91a7ba;
        }

        /* Services */

        #services {
            background: #081522;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .service {
            overflow: hidden;
            border-radius: 19px;
            border: 1px solid #243b50;
            background: #0d1c2c;
            transition: .25s;
        }

        .service:hover {
            transform: translateY(-7px);
            border-color: #20d6c7;
        }

        .service-image {
            height: 175px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
        }

        .image-blue {
            background: linear-gradient(135deg,#075985,#0ea5e9);
        }

        .image-green {
            background: linear-gradient(135deg,#047857,#10b981);
        }

        .image-purple {
            background: linear-gradient(135deg,#5b21b6,#8b5cf6);
        }

        .image-orange {
            background: linear-gradient(135deg,#c2410c,#f97316);
        }

        .image-pink {
            background: linear-gradient(135deg,#9d174d,#ec4899);
        }

        .image-cyan {
            background: linear-gradient(135deg,#0e7490,#06b6d4);
        }

        .image-yellow {
            background: linear-gradient(135deg,#a16207,#eab308);
        }

        .image-red {
            background: linear-gradient(135deg,#991b1b,#ef4444);
        }

        .image-indigo {
            background: linear-gradient(135deg,#3730a3,#6366f1);
        }

        .image-teal {
            background: linear-gradient(135deg,#115e59,#14b8a6);
        }

        .service-content {
            padding: 23px;
        }

        .service h3 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .service p {
            color: #aebdca;
            font-size: 14px;
        }

        /* Why */

        #why {
            background: #0a1827;
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 18px;
        }

        .why-item {
            padding: 23px;
            background: #0e2032;
            border-radius: 15px;
            border-right: 4px solid #20d6c7;
        }

        .why-item h3 {
            margin-bottom: 6px;
        }

        .why-item p {
            color: #aebdca;
            font-size: 14px;
        }

        /* Portfolio */

        .portfolio {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .portfolio-card {
            min-height: 190px;
            padding: 30px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: end;
            background: linear-gradient(145deg,#123b54,#102032);
            border: 1px solid #28475e;
        }

        .portfolio-card:nth-child(2) {
            background: linear-gradient(145deg,#24356c,#171d39);
        }

        .portfolio-card:nth-child(3) {
            background: linear-gradient(145deg,#24533e,#10251e);
        }

        .portfolio-card h3 {
            margin-bottom: 5px;
        }

        .portfolio-card p {
            color: #b6c7d5;
            font-size: 14px;
        }

        /* About */

        .about-box {
            max-width: 850px;
            margin: auto;
            text-align: center;
            background: #0d1c2c;
            border: 1px solid #223d55;
            padding: 38px;
            border-radius: 20px;
        }

        .about-box p {
            color: #b7c6d3;
        }

        /* FAQ */

        .faq {
            max-width: 850px;
            margin: auto;
        }

        details {
            background: #0d1c2c;
            border: 1px solid #223b52;
            border-radius: 13px;
            padding: 17px 20px;
            margin-bottom: 12px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }

        details p {
            color: #aebdca;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Contact */

        #contact {
            background: linear-gradient(135deg,#092437,#101c35);
        }

        .contact-box {
            text-align: center;
            padding: 55px 20px;
            border-radius: 23px;
            border: 1px solid #28516a;
        }

        .contact-box p {
            color: #b9c8d6;
            margin-top: 8px;
        }

        .phone {
            display: block;
            margin: 22px 0;
            color: #20d6c7;
            font-size: 28px;
            direction: ltr;
        }
